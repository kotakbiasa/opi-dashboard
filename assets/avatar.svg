<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Circular Base -->
  <circle cx="60" cy="60" r="58" fill="url(#bgGrad)"/>
  
  <!-- Subtle Inner Ring -->
  <circle cx="60" cy="60" r="52" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3"/>

  <!-- PCB Board Outline -->
  <rect x="26" y="26" width="68" height="68" rx="14" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>

  <!-- Circuit Lines -->
  <path d="M36,26 L36,40 L44,48 L44,60" fill="none" stroke="#7dd3fc" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
  <path d="M84,26 L84,38 L76,46 L76,60" fill="none" stroke="#7dd3fc" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
  <path d="M36,94 L36,80 L46,70" fill="none" stroke="#7dd3fc" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
  <path d="M84,94 L84,82 L74,72" fill="none" stroke="#7dd3fc" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>

  <!-- CPU SoC Chip (Allwinner H616) -->
  <rect x="42" y="42" width="36" height="36" rx="8" fill="url(#chipGrad)" stroke="#f59e0b" stroke-width="2" filter="url(#glow)"/>
  
  <!-- Orange Fruit Accent Icon in center -->
  <circle cx="60" cy="58" r="9" fill="url(#orangeGrad)"/>
  <!-- Leaf -->
  <path d="M60,49 Q64,46 65,49 Q63,53 60,51 Z" fill="#22c55e"/>

  <!-- SoC Label Text -->
  <text x="60" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="6.5" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="0.5">H616</text>

  <!-- Power Status LED (Green) -->
  <circle cx="34" cy="34" r="3" fill="#22c55e" filter="url(#glow)"/>
  <circle cx="34" cy="34" r="1.5" fill="#ffffff"/>
</svg>
